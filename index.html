<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page">
    <div class="glow"></div>

    <div class="header">
      <div class="subtitle">НАША КВАРТИРА</div>
      <h1 class="title">Уборка</h1>
    </div>



    <!-- WEEK NAV -->
    <div class="week-row">
      <div class="week-nav">
        <button aria-label="Предыдущая неделя" id="prev">‹</button>
        <div class="week-info">
          <span class="label" id="week-title">Эта неделя</span>
          <span class="dates" id="week-range">12 окт. – 18 окт.</span>
        </div>
        <button aria-label="Следующая неделя" id="next">›</button>
      </div>

      <p class="progress-circle" id="progress">0</p>
    </div>

    <a class="back-link">Вернуться к текущей неделе</a>

    <!-- CARDS -->
    <div class="cards">

      <!-- Кухня -->

      <section id="rooms"></section>


      

      

    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
